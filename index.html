<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf6ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141317" media="(prefers-color-scheme: dark)">
<meta name="description" content="Swipe-to-learn everyday Korean conversation.">
<title>Dongne</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="hud">
  <div id="ring" title="Today's cards">
    <svg viewBox="0 0 36 36" aria-hidden="true">
      <circle class="ring-bg" cx="18" cy="18" r="15.9155"/>
      <circle id="ring-fg" cx="18" cy="18" r="15.9155"/>
    </svg>
    <span id="ring-n">0</span>
  </div>
  <span id="streak">🔥 0</span>
  <button id="focus" class="chip-btn"></button>
  <button id="quiet" class="icon-btn" aria-label="Toggle quiet mode"></button>
  <button id="gear" class="icon-btn" aria-label="Settings">⚙️</button>
</header>
<main>
  <div id="view-feed" class="view on"><div id="feed"></div></div>
  <div id="view-map" class="view page"></div>
  <div id="view-grammar" class="view page"></div>
  <div id="view-words" class="view page"></div>
  <div id="view-review" class="view page"></div>
  <div id="view-progress" class="view page"></div>
  <div id="view-settings" class="view page"></div>
</main>
<nav>
  <button data-v="feed" class="on"><span>▶️</span>피드</button>
  <button data-v="map"><span>🏘️</span>동네</button>
  <button data-v="grammar"><span>📐</span>문법</button>
  <button data-v="words"><span>📖</span>단어장</button>
  <button data-v="review"><span>🔁</span>복습</button>
  <button data-v="progress"><span>📈</span>기록</button>
</nav>
<div id="toast" role="status"></div>
<script src="content.js"></script>
<script src="vocab.js"></script>
<script src="speech.js"></script>
<script src="app.js"></script>
</body>
</html>
